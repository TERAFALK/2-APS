name: vanertekno-aps

# Gemensam härdning: ingen process kan skaffa sig mer rättigheter (setuid m.m.).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]

# App-containrarna: skrivskyddat filsystem (inget kan planteras i containern),
# ingen root, inga Linux-capabilities. Bara /tmp är skrivbar (RAM, töms vid omstart).
x-app: &app
  <<: *hardening
  build: ./backend
  restart: unless-stopped
  env_file: .env
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  networks: [internal]

services:
  db:
    <<: *hardening
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    <<: *hardening
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]

  beat:
    <<: *app
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info",
              "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    <<: *hardening
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    # LABB bakom NPM: peka din proxy-host på  aps-frontend:80.
    # Frontend ligger BARA på interna nät (internal + npm_edge) och kan därför inte
    # ansluta ut mot internet. NPM når den via npm_edge. Frontend-nginx proxar /api → api.
    networks:
      internal: {}
      npm_edge:
        aliases: [aps-frontend]

  gateway:
    <<: *hardening
    image: caddy:2-alpine
    restart: unless-stopped
    # Startar BARA vid kunddrift med egen TLS:  docker compose --profile tls up -d
    # I labb bakom NPM behövs den inte — NPM pratar direkt med aps-frontend.
    profiles: [tls]
    depends_on: [api, frontend]
    # Gatewayn ligger på npm_proxy (ej internt nät) eftersom Caddy behöver nå
    # Let's Encrypt och kunna publicera portar vid kunddrift.
    # KUNDDRIFT med egen TLS: avkommentera ports nedan och sätt SITE_ADDRESS=https://... .
    # ports:
    #   - "${HTTP_PORT:-80}:80"
    #   - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TLS_EMAIL: ${TLS_EMAIL}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal: {}
      npm_proxy:
        aliases: [aps-gateway]

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # Internt nät utan väg ut mot internet: db, redis, api, worker, beat, frontend.
  internal:
    driver: bridge
    internal: true
  # Internt nät som delas med Nginx Proxy Manager — utan internetåtkomst.
  # Skapas en gång på servern:  docker network create --internal npm_edge
  # och NPM-containern ansluts till det (se README, "Drift bakom NPM").
  npm_edge:
    external: true
  # Befintligt, externt nätverk som NPM ligger på. Används bara av gateway (profil tls).
  npm_proxy:
    external: true
